name: Update training site

on:
  schedule:
    - cron: "40 5 * * *"      # every morning, 06:40 UK time (05:40 UTC in summer)
  workflow_dispatch:           # "Run workflow" button
  repository_dispatch:         # sent by the iPhone Shortcut each week
    types: [runs-upload]
  push:
    branches: [main]
    paths: ["config/**", "site/**", "scripts/**", "runs/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Merge Shortcut upload (only on repository_dispatch)
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python scripts/ingest.py
          git config user.name "training-bot"
          git config user.email "training-bot@users.noreply.github.com"
          git add runs
          git commit -m "Update runs from Shortcut upload" || true
          git pull --rebase -q && git push -q

      - name: Load runs
        run: python scripts/load_runs.py

      - name: Adjust the plan
        run: python scripts/adapt.py

      - name: Weekly coaching note (optional)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/commentary.py

      - name: Build site
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
